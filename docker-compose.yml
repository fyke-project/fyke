services:
  postgres:
    image: postgres:17-alpine
    container_name: fyke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fyke
      POSTGRES_USER: fyke
      POSTGRES_PASSWORD: fyke
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fyke -d fyke"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fyke-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: fyke-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
    ports:
      - "9092:9092"     # Kafka broker (external)
      - "9644:9644"     # Redpanda Admin API
      - "18081:18081"   # Schema Registry (external)
      - "18082:18082"   # Pandaproxy HTTP API (external)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: fyke-redpanda-console
    restart: unless-stopped
    ports:
      - "8085:8080"     # Redpanda Console Web UI (mapped to 8085 to avoid colliding with demo app on 8080)
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  redpanda-data:
