spring:
  application:
    name: fyke-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/fyke
    username: fyke
    password: fyke
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 50ms

fyke:
  enabled: true
  outbox:
    enabled: true
    poll-interval: 200ms
    batch-size: 50
    retention:
      enabled: true
      ttl: 7d

  inbox:
    enabled: true
    poll-interval: 200ms
    batch-size: 50
    initial-backoff: 500ms
    retention:
      enabled: true
      ttl: 7d

  dlq:
    retention:
      enabled: true
      ttl: 30d

  retention:
    enabled: true
